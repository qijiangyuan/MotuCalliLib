{% extends 'base.html' %} {% block title %}字形详情{% endblock %} {% block content %}
<a href="/library" class="back-link">← 返回书法字典</a>
<section id="glyphDetail" class="detail-heading panel">
  <p>正在读取字形资料…</p>
</section>
<div class="section-heading">
  <h2>字形图版</h2>
  <p class="muted">点击图片放大查看；可记录图片与文字不符等问题。</p>
</div>
<section id="detailImages" class="detail-grid"></section>
<dialog id="imageDialog">
  <button class="dialog-close" aria-label="关闭图片预览">×</button>
  <img id="largeImage" alt="字形放大图" />
  <p id="largeCaption"></p>
</dialog>
<dialog id="reportDialog" class="small-dialog">
  <form id="reportForm">
    <h2>字形纠错</h2>
    <p class="muted">请描述图片与文字、书家或出处不一致的情况。</p>
    <label>
      纠错说明
      <textarea
        id="reportReason"
        required
        minlength="2"
        maxlength="500"
        rows="4"
        placeholder="例如：该图对应的汉字应为……"
      ></textarea>
    </label>
    <div class="actions">
      <button type="button" class="button secondary dialog-close">取消</button>
      <button class="button primary" type="submit">保存纠错记录</button>
    </div>
  </form>
</dialog>
{% endblock %}

{% extends 'base.html' %} {% block title %}书法字典{% endblock %} {% block content %}
<div class="page-heading">
  <div>
    <div class="eyebrow">DICTIONARY / 书法字典</div>
    <h1>一字千面，循迹而观</h1>
    <p>检索历代字形，比较书体与出处，收藏值得反复临习的一笔。</p>
  </div>
  <a class="button secondary" href="/calligraphy_set">去集字创作 ↗</a>
</div>
<section class="panel search-panel">
  <form id="librarySearch">
    <div class="search-row">
      <label class="sr-only" for="searchHan">搜索汉字</label>
      <input
        id="searchHan"
        name="han"
        maxlength="200"
        placeholder="输入一个或多个汉字，如：永、春和景明"
      />
      <button class="button primary" type="submit">检索字形</button>
      <button class="button subtle" id="resetSearch" type="button">重置</button>
    </div>
    <div class="filter-row">
      <label>
        书体
        <select id="fontFilter" name="font">
          <option value="">全部书体</option>
        </select>
      </label>
      <label>
        书法家
        <input
          id="authorFilter"
          name="author"
          list="authorOptions"
          placeholder="全部书家，可输入查找"
        />
        <datalist id="authorOptions"></datalist>
      </label>
      <label>
        典籍
        <input
          id="bookFilter"
          name="book"
          list="bookOptions"
          placeholder="全部典籍，可输入查找"
        />
        <datalist id="bookOptions"></datalist>
      </label>
    </div>
  </form>
</section>
<div class="results-toolbar">
  <div class="tabs" role="group" aria-label="检索范围">
    <button id="allGlyphs" class="tab active">全部字形</button>
    <button id="favoriteGlyphs" class="tab">我的收藏</button>
  </div>
  <span id="resultCount" class="muted" role="status">正在加载字库…</span>
</div>
<div id="hanChips" class="chips"></div>
<section id="glyphResults" class="glyph-grid" aria-label="字形检索结果"></section>
<nav id="pagination" class="pagination" aria-label="检索结果分页"></nav>
{% endblock %}
